server {
    listen 80;
    
    # Raiz onde o vite fará o build
    root /usr/share/nginx/html;
    index index.html;

    # Fallback para o React Router (SPAs)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desativa log para assets estáticos e adiciona cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
